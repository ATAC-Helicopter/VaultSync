name: Update or install problem
description: Report installer, patch update, package, or release asset problems.
title: "[Update/Install]: "
labels:
  - bug
  - area:release
  - release:1.8.0
assignees:
  - ATAC-Helicopter
body:
  - type: input
    id: current_version
    attributes:
      label: Current version
      placeholder: "1.7.5"
    validations:
      required: true
  - type: input
    id: target_version
    attributes:
      label: Target version
      placeholder: "1.8.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: package_type
    attributes:
      label: Package or update type
      options:
        - In-app patch update
        - Windows installer
        - Microsoft Store package
        - Linux .deb
        - Linux AppImage
        - Linux tar.gz
        - macOS DMG
        - Portable/manual copy
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Include exact installer/updater messages and whether the app was installed in a protected folder.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Update diagnostics
      description: Paste updater diagnostics from Settings > Advanced, workflow/release asset name, or terminal output.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround tried
      description: Did a full installer, restart, manual download, or uninstall/reinstall help?

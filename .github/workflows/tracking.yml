name: Work Tracking

on:
  pull_request:
    branches: ["**"]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: work-tracking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracking:
    name: Tracking policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Validate tracking regression tests
        run: python3 -m unittest discover -s tests/scripts -p 'test_work_tracking.py'

      - name: Validate tracking
        run: python3 scripts/work_tracking.py check-event

name: Work Tracking

on:
  pull_request:
    branches: ["**"]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: work-tracking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracking:
    name: Tracking policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Validate tracking
        run: python3 scripts/work_tracking.py check-event

name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel for this asset build"
        required: true
        type: choice
        options:
          - beta
          - stable
      previous_version:
        description: "Primary previous/base version for patch manifests (optional if the allowlist is provided)"
        required: false
      previous_versions:
        description: "Optional comma/newline separated exact base-version allowlist for one manifest (defaults to previous_version only)"
        required: false
      target_version:
        description: "Target version for patch manifests (e.g., 1.7.4-Beta.1 or 1.7.4)"
        required: true
      include_linux_patches:
        description: "Build Linux patch assets. Leave off when Linux installer fallback is required for protected installs."
        required: false
        type: boolean
        default: false
      include_store_upload:
        description: "Build Microsoft Store Partner Center upload package (.msixupload) from the Store packaging project."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      patch_base_versions: ${{ steps.validate_inputs.outputs.patch_base_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        id: validate_inputs
        shell: bash
        run: |
          set -euo pipefail

          channel="${{ inputs.release_channel }}"
          previous="${{ inputs.previous_version }}"
          previous_versions_raw="${{ inputs.previous_versions }}"
          target="${{ inputs.target_version }}"
          branch="${{ github.ref_name }}"

          trim() {
            sed 's/\r//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          normalize_version() {
            local value
            value="$(printf '%s' "$1" | trim)"
            value="${value#v}"
            value="${value#V}"
            printf '%s' "${value,,}"
          }

          target="$(printf '%s' "$target" | trim)"
          previous="$(printf '%s' "$previous" | trim)"
          target_key="$(normalize_version "$target")"

          if [[ -z "$target" ]]; then
            echo "target_version is required."
            exit 1
          fi

          project_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/VaultSync.UI/VaultSync.UI.csproj | head -n 1 | trim)"
          if [[ -z "$project_version" ]]; then
            echo "Could not read src/VaultSync.UI/VaultSync.UI.csproj <Version>."
            exit 1
          fi

          if [[ "$(normalize_version "$project_version")" != "$target_key" ]]; then
            echo "target_version '$target' does not match project version '$project_version'."
            exit 1
          fi

          declare -A seen_versions=()
          requested_versions=()
          while IFS= read -r candidate; do
            candidate="$(printf '%s' "$candidate" | trim)"
            [[ -n "$candidate" ]] || continue

            candidate_key="$(normalize_version "$candidate")"
            if [[ "$candidate_key" == "$target_key" ]]; then
              echo "::warning::Ignoring base version '$candidate' because it matches target_version '$target'."
              continue
            fi

            if [[ -z "${seen_versions[$candidate_key]+x}" ]]; then
              seen_versions[$candidate_key]=1
              requested_versions+=("$candidate")
            fi
          done < <(
            {
              printf '%s\n' "$previous"
              printf '%s\n' "$previous_versions_raw" | tr ',;' '\n'
            }
          )

          if [[ ${#requested_versions[@]} -eq 0 ]]; then
            echo "At least one previous/base version different from target_version '$target' is required."
            exit 1
          fi

          if [[ "$channel" == "beta" ]]; then
            if [[ "$branch" != "Dev" ]]; then
              echo "Beta asset builds must be run from the Dev branch. Current branch: $branch"
              exit 1
            fi
            if [[ "$target" != *-* ]]; then
              echo "Beta target_version must include a prerelease suffix (example: 1.7.x-beta.N)."
              exit 1
            fi
          fi

          if [[ "$channel" == "stable" ]]; then
            if [[ "$branch" != "Stable" ]]; then
              echo "Stable asset builds must be run from the Stable branch. Current branch: $branch"
              exit 1
            fi
            if [[ "$target" == *-* ]]; then
              echo "Stable target_version must not include a prerelease suffix."
              exit 1
            fi
          fi

          {
            echo "patch_base_versions<<EOF"
            printf '%s\n' "${requested_versions[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release asset validation
          - Channel: \`$channel\`
          - Branch: \`$branch\`
          - Project version: \`$project_version\`
          - Primary previous version: \`${previous:-"(none)"}\`
          - Base allow-list:
          EOF
          for base in "${requested_versions[@]}"; do
            echo "  - \`$base\`" >> "$GITHUB_STEP_SUMMARY"
          done
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          - Target version: \`$target\`
          EOF

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        if: ${{ inputs.include_store_upload }}
        uses: microsoft/setup-msbuild@v2

      - name: Publish (win-x64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --self-contained true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc /Odist\\windows installer\\VaultSyncInstaller.iss

      - name: Build patch assets
        shell: pwsh
        env:
          PATCH_BASE_VERSIONS: ${{ needs.validate.outputs.patch_base_versions }}
        run: |
          $patchDir = "patches/v${{ inputs.target_version }}"
          New-Item -ItemType Directory -Force $patchDir | Out-Null
          $baseVersions = @()
          foreach ($line in $env:PATCH_BASE_VERSIONS -split "`r?`n")
          {
            $trimmed = $line.Trim()
            if ($trimmed) { $baseVersions += $trimmed }
          }
          $previousArgs = foreach ($baseVersion in $baseVersions) { "--previous"; $baseVersion }
          python scripts/build_patch.py `
            --base-dir "src/VaultSync.UI/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish" `
            --out-zip "$patchDir/vaultsync-patch-windows.zip" `
            --out-manifest "$patchDir/vaultsync-patch-windows.json" `
            --platform windows `
            @previousArgs `
            --target "${{ inputs.target_version }}"

      - name: Prepare Microsoft Store manifest version
        if: ${{ inputs.include_store_upload }}
        shell: pwsh
        run: |
          $target = "${{ inputs.target_version }}"
          $baseVersion = ($target -split "-", 2)[0]
          $parts = $baseVersion.Split(".")
          if ($parts.Count -lt 3) {
            throw "target_version '$target' must include at least major.minor.patch for Store packaging."
          }

          $storeVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $manifestPath = "packaging/VaultSync.Store/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("pkg", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $identity = $manifest.SelectSingleNode("/pkg:Package/pkg:Identity", $ns)
          if ($null -eq $identity) {
            throw "Could not find Package/Identity in $manifestPath."
          }

          $identity.Version = $storeVersion
          $manifest.Save((Resolve-Path $manifestPath))
          "STORE_PACKAGE_VERSION=$storeVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Add-Content $env:GITHUB_STEP_SUMMARY "## Microsoft Store package"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Store manifest version: ``$storeVersion``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Store identity: ``FlavioGiacchetti.480851279F98B``"

      - name: Build Microsoft Store upload package
        if: ${{ inputs.include_store_upload }}
        shell: pwsh
        run: |
          $storeDir = Join-Path $PWD "dist/store"
          New-Item -ItemType Directory -Force $storeDir | Out-Null

          msbuild packaging/VaultSync.Store/VaultSync.Store.wapproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxPackageDir="$storeDir\\"

          $upload = Get-ChildItem -Path "packaging/VaultSync.Store", "dist/store" -Recurse -Include *.msixupload,*.appxupload |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $upload) {
            throw "Store upload package was not produced."
          }

          $extension = $upload.Extension
          $targetPath = Join-Path $storeDir "VaultSync-Store-${{ inputs.target_version }}-x64$extension"
          Copy-Item $upload.FullName $targetPath -Force
          Add-Content $env:GITHUB_STEP_SUMMARY "- Upload artifact: ``$targetPath``"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/windows/VaultSync-Setup-*.exe
            patches/v${{ inputs.target_version }}/vaultsync-patch-windows.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-windows.zip

      - name: Upload Microsoft Store artifact
        if: ${{ inputs.include_store_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-upload
          path: |
            dist/store/*.msixupload
            dist/store/*.appxupload

  macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (osx-arm64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r osx-arm64
          --self-contained true

      - name: Publish (osx-x64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r osx-x64
          --self-contained true

      - name: Build DMGs
        run: |
          bash scripts/build_macos_dmg.sh "${{ inputs.target_version }}" arm64 src/VaultSync.UI/bin/Release/net10.0/osx-arm64/publish
          bash scripts/build_macos_dmg.sh "${{ inputs.target_version }}" x64 src/VaultSync.UI/bin/Release/net10.0/osx-x64/publish

      - name: Build patch assets
        env:
          PATCH_BASE_VERSIONS: ${{ needs.validate.outputs.patch_base_versions }}
        run: |
          mkdir -p "patches/v${{ inputs.target_version }}"
          previous_args=()
          while IFS= read -r base; do
            [[ -n "$base" ]] || continue
            previous_args+=( --previous "$base" )
          done <<'EOF'
          ${{ needs.validate.outputs.patch_base_versions }}
          EOF
          python3 scripts/build_patch.py \
            --base-dir "src/VaultSync.UI/bin/Release/net10.0/osx-arm64/publish" \
            --out-zip "patches/v${{ inputs.target_version }}/vaultsync-patch-macos-apple-silicon.zip" \
            --out-manifest "patches/v${{ inputs.target_version }}/vaultsync-patch-macos-apple-silicon.json" \
            --platform macos \
            "${previous_args[@]}" \
            --target "${{ inputs.target_version }}"
          python3 scripts/build_patch.py \
            --base-dir "src/VaultSync.UI/bin/Release/net10.0/osx-x64/publish" \
            --out-zip "patches/v${{ inputs.target_version }}/vaultsync-patch-macos-intel.zip" \
            --out-manifest "patches/v${{ inputs.target_version }}/vaultsync-patch-macos-intel.json" \
            --platform macos \
            "${previous_args[@]}" \
            --target "${{ inputs.target_version }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            dist/macos/VaultSync-*-macos-apple-silicon.dmg
            dist/macos/VaultSync-*-macos-intel.dmg
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-apple-silicon.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-apple-silicon.zip
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-intel.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-intel.zip

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (linux-x64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r linux-x64
          --self-contained true

      - name: Publish (linux-arm64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r linux-arm64
          --self-contained true

      - name: Build Linux archives
        run: |
          bash scripts/build_linux_release.sh "${{ inputs.target_version }}" x64 src/VaultSync.UI/bin/Release/net10.0/linux-x64/publish
          bash scripts/build_linux_release.sh "${{ inputs.target_version }}" arm64 src/VaultSync.UI/bin/Release/net10.0/linux-arm64/publish

      - name: Build patch assets
        if: ${{ inputs.include_linux_patches }}
        env:
          PATCH_BASE_VERSIONS: ${{ needs.validate.outputs.patch_base_versions }}
        run: |
          mkdir -p "patches/v${{ inputs.target_version }}"
          previous_args=()
          while IFS= read -r base; do
            [[ -n "$base" ]] || continue
            previous_args+=( --previous "$base" )
          done <<'EOF'
          ${{ needs.validate.outputs.patch_base_versions }}
          EOF
          python3 scripts/build_patch.py \
            --base-dir "src/VaultSync.UI/bin/Release/net10.0/linux-x64/publish" \
            --out-zip "patches/v${{ inputs.target_version }}/vaultsync-patch-linux-x64.zip" \
            --out-manifest "patches/v${{ inputs.target_version }}/vaultsync-patch-linux-x64.json" \
            --platform linux \
            "${previous_args[@]}" \
            --target "${{ inputs.target_version }}"
          python3 scripts/build_patch.py \
            --base-dir "src/VaultSync.UI/bin/Release/net10.0/linux-arm64/publish" \
            --out-zip "patches/v${{ inputs.target_version }}/vaultsync-patch-linux-arm64.zip" \
            --out-manifest "patches/v${{ inputs.target_version }}/vaultsync-patch-linux-arm64.json" \
            --platform linux \
            "${previous_args[@]}" \
            --target "${{ inputs.target_version }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            dist/linux/VaultSync-*-linux-x64.tar.gz
            dist/linux/VaultSync-*-linux-arm64.tar.gz
            dist/linux/VaultSync-*-linux-x64.deb
            dist/linux/VaultSync-*-linux-arm64.deb
            dist/linux/VaultSync-*-linux-x64.AppImage
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-x64.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-x64.zip
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-arm64.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-arm64.zip

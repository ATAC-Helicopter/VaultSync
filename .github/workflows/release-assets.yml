name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel for this asset build"
        required: true
        type: choice
        options:
          - beta
          - stable
      previous_version:
        description: "Single qualified previous/base version for patch manifests"
        required: true
      target_version:
        description: "Target version for patch manifests (e.g., 1.8.0-Beta.1 or 1.8.0)"
        required: true
      release_candidate:
        description: "Build unpublished stable-version candidate assets from a matching release/X.Y.Z branch"
        required: false
        type: boolean
        default: false
      include_windows_patches:
        description: "Build Windows patch assets. Leave off for installer-managed updates."
        required: false
        type: boolean
        default: false
      include_macos_patches:
        description: "Build macOS patch assets. Leave off for DMG-managed updates."
        required: false
        type: boolean
        default: false
      include_linux_patches:
        description: "Build Linux patch assets. Leave off when Linux installer fallback is required for protected installs."
        required: false
        type: boolean
        default: false
      include_store_upload:
        description: "Build Microsoft Store Partner Center upload package (.msixupload) from the Store packaging project."
        required: false
        type: boolean
        default: false
      prepare_draft_from_run:
        description: "Assemble the existing unpublished draft from a successful qualified asset run; skips rebuilding."
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      patch_base_versions_windows: ${{ steps.validate_inputs.outputs.patch_base_versions_windows }}
      patch_base_versions_macos: ${{ steps.validate_inputs.outputs.patch_base_versions_macos }}
      patch_base_versions_linux: ${{ steps.validate_inputs.outputs.patch_base_versions_linux }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release inputs
        id: validate_inputs
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          ASSEMBLE_DRAFT: ${{ inputs.prepare_draft_from_run }}
        run: |
          set -euo pipefail

          channel="$RELEASE_CHANNEL"
          previous="$PREVIOUS_VERSION"
          target="$TARGET_VERSION"
          release_candidate="$RELEASE_CANDIDATE"
          branch="$GITHUB_REF_NAME"

          if [[ -n "$ASSEMBLE_DRAFT" ]]; then
            if [[ "$channel" != "stable" || "$release_candidate" == "true" || "$branch" != "Stable" ]]; then
              echo 'Final draft assets must be generated from Stable, not a release-branch candidate.' >&2
              exit 1
            fi
          fi

          trim() {
            sed 's/\r//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          normalize_version() {
            local value
            value="$(printf '%s' "$1" | trim)"
            value="${value#v}"
            value="${value#V}"
            printf '%s' "${value,,}"
          }

          target="$(printf '%s' "$target" | trim)"
          previous="$(printf '%s' "$previous" | trim)"
          target_key="$(normalize_version "$target")"
          canonical_target="$(python3 -c 'import json; print(json.load(open("release/release-metadata.json"))["activeRelease"]["version"])')"
          canonical_previous="$(python3 -c 'import json; print(json.load(open("release/release-metadata.json"))["activeRelease"]["previousVersion"])')"

          if [[ -z "$target" ]]; then
            echo "target_version is required."
            exit 1
          fi

          if [[ "$target" != "$canonical_target" ]]; then
            echo "target_version '$target' does not match canonical active release '$canonical_target'."
            exit 1
          fi

          if [[ "$previous" != "$canonical_previous" ]]; then
            echo "previous_version '$previous' does not match qualified canonical predecessor '$canonical_previous'."
            exit 1
          fi

          project_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/VaultSync.UI/VaultSync.UI.csproj | head -n 1 | trim)"
          if [[ -z "$project_version" ]]; then
            echo "Could not read src/VaultSync.UI/VaultSync.UI.csproj <Version>."
            exit 1
          fi

          if [[ "$(normalize_version "$project_version")" != "$target_key" ]]; then
            echo "target_version '$target' does not match project version '$project_version'."
            exit 1
          fi

          previous_key="$(normalize_version "$previous")"
          if [[ -z "$previous" ]]; then
            echo "previous_version is required. Automated patch builds support one explicitly qualified base version."
            exit 1
          fi
          if [[ "$previous_key" == "$target_key" ]]; then
            echo "previous_version must be different from target_version '$target'."
            exit 1
          fi

          if [[ "$channel" == "beta" ]]; then
            if [[ "$release_candidate" == "true" ]]; then
              echo "release_candidate can only be used with the stable channel."
              exit 1
            fi
            if [[ "$branch" != "Dev" ]]; then
              echo "Beta asset builds must run from Dev. Current branch: $branch"
              exit 1
            fi
            if [[ "$target" != *-* ]]; then
              echo "Beta target_version must include a prerelease suffix (example: 1.7.x-beta.N)."
              exit 1
            fi
          fi

          if [[ "$channel" == "stable" ]]; then
            if [[ "$release_candidate" == "true" ]]; then
              expected_candidate_branch="release/${target}"
              if [[ "$branch" != "$expected_candidate_branch" ]]; then
                echo "Release candidate asset builds must run from '$expected_candidate_branch'. Current branch: $branch"
                exit 1
              fi
            elif [[ "$branch" != "Stable" ]]; then
              echo "Stable asset builds must be run from the Stable branch unless release_candidate is enabled. Current branch: $branch"
              exit 1
            fi
            if [[ "$target" == *-* ]]; then
              echo "Stable target_version must not include a prerelease suffix."
              exit 1
            fi
          fi

          for platform in windows macos linux; do
            candidates="$(jq -r --arg platform "$platform" '.activeRelease.patchBaseCandidates[$platform][]? // empty' release/release-metadata.json)"
            {
              echo "patch_base_versions_${platform}<<EOF"
              printf '%s\n' "$previous"
              printf '%s\n' "$candidates" | sed '/^[[:space:]]*$/d'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release asset validation
          - Channel: \`$channel\`
          - Branch: \`$branch\`
          - Release candidate: \`$release_candidate\`
          - Project version: \`$project_version\`
          - Primary previous version: \`${previous:-"(none)"}\`
          - Primary qualified patch base:
          EOF
          echo "  - \`$previous\`" >> "$GITHUB_STEP_SUMMARY"
          for platform in windows macos linux; do
            candidates="$(jq -r --arg platform "$platform" '.activeRelease.patchBaseCandidates[$platform][]? // empty' release/release-metadata.json | paste -sd ', ' -)"
            echo "- Additional $platform overlay candidates: \`${candidates:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          - Target version: \`$target\`
          EOF

  quality-gate:
    name: Test and dependency audit
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore VaultSync.sln

      - name: Build
        run: dotnet build VaultSync.sln --configuration Release --no-restore -warnaserror -p:UseSharedCompilation=false -m:1

      - name: Test
        run: dotnet test tests/VaultSync.Core.Tests/VaultSync.Core.Tests.csproj --configuration Release --no-build -warnaserror -p:UseSharedCompilation=false

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          dotnet list VaultSync.sln package --vulnerable --include-transitive --format json > "$report"
          jq -e '[.. | objects | select((.vulnerabilities? // []) | length > 0)] | length == 0' "$report" >/dev/null || {
            jq '[.. | objects | select((.vulnerabilities? // []) | length > 0)]' "$report"
            echo "NuGet vulnerability audit failed." >&2
            exit 1
          }

  windows:
    if: ${{ !inputs.prepare_draft_from_run }}
    needs: [validate, quality-gate]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        if: ${{ inputs.include_store_upload }}
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Install Microsoft Store packaging workload
        if: ${{ inputs.include_store_upload }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installer = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vs_installer.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Could not find vswhere at $vswhere."
          }
          if (-not (Test-Path $installer)) {
            throw "Could not find Visual Studio Installer at $installer."
          }

          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw "Could not resolve a Visual Studio installation path."
          }

          $args = @(
            "modify",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Workload.Universal",
            "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041",
            "--includeRecommended",
            "--quiet",
            "--norestart",
            "--wait"
          )

          & $installer @args
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "Visual Studio Installer failed with exit code $LASTEXITCODE."
          }

      - name: Resolve Microsoft Store packaging SDK
        if: ${{ inputs.include_store_upload }}
        shell: pwsh
        run: |
          $platformRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/Platforms/UAP"
          if (-not (Test-Path $platformRoot)) {
            throw "Could not find UAP SDK platform root: $platformRoot"
          }

          $sdks = Get-ChildItem $platformRoot -Directory
          $sdk = $sdks |
            Where-Object { $_.Name -eq "10.0.19041.0" } |
            Select-Object -First 1
          if ($null -eq $sdk) {
            $sdk = $sdks |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          }

          if ($null -eq $sdk) {
            throw "No installed UAP SDK was found under $platformRoot."
          }

          $wapprojPath = "packaging/VaultSync.Store/VaultSync.Store.wapproj"
          [xml]$wapproj = Get-Content $wapprojPath
          $ns = New-Object System.Xml.XmlNamespaceManager($wapproj.NameTable)
          $ns.AddNamespace("msb", "http://schemas.microsoft.com/developer/msbuild/2003")
          $targetPlatformVersion = $wapproj.SelectSingleNode("/msb:Project/msb:PropertyGroup/msb:TargetPlatformVersion", $ns)
          if ($null -eq $targetPlatformVersion) {
            throw "Could not find TargetPlatformVersion in $wapprojPath."
          }
          $targetPlatformVersion.InnerText = $sdk.Name
          $wapproj.Save((Resolve-Path $wapprojPath))

          "STORE_TARGET_PLATFORM_VERSION=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Add-Content $env:GITHUB_STEP_SUMMARY "- Store packaging SDK: ``$($sdk.Name)``"

      - name: Publish (win-x64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --self-contained true
          -p:VaultSyncReleaseChannel=stable
          -p:VaultSyncPackageKind=windows-installer
          -p:VaultSyncUpdateSource=github
          -p:VaultSyncOfficialBuild=true
          -p:VaultSyncSignatureStatus=unsigned
          -p:SourceRevisionId=${{ github.sha }}

      - name: Verify embedded runtime (win-x64)
        run: >
          python scripts/runtime_pack_audit.py
          --runtimeconfig src/VaultSync.UI/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/VaultSync.UI.runtimeconfig.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc /Odist\\windows installer\\VaultSyncInstaller.iss

      - name: Build patch assets
        if: ${{ inputs.include_windows_patches }}
        shell: pwsh
        env:
          PATCH_BASE_VERSIONS: ${{ needs.validate.outputs.patch_base_versions_windows }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          $targetVersion = $env:TARGET_VERSION
          $patchDir = "patches/v$targetVersion"
          New-Item -ItemType Directory -Force $patchDir | Out-Null
          $baseVersions = @()
          foreach ($line in $env:PATCH_BASE_VERSIONS -split "`r?`n")
          {
            $trimmed = $line.Trim()
            if ($trimmed) { $baseVersions += $trimmed }
          }
          $previousArgs = foreach ($baseVersion in $baseVersions) { "--previous"; $baseVersion }
          $baseManifestArgs = @()
          foreach ($baseVersion in ($baseVersions | Select-Object -Skip 1)) {
            $manifestDir = ".patch-bases/windows"
            New-Item -ItemType Directory -Force $manifestDir | Out-Null
            $manifestPath = Join-Path $manifestDir "$baseVersion.json"
            $url = "https://github.com/ATAC-Helicopter/VaultSync/releases/download/v$baseVersion/vaultsync-patch-windows.json"
            Invoke-WebRequest -Uri $url -OutFile $manifestPath
            $baseManifestArgs += "--base-manifest"
            $baseManifestArgs += "$baseVersion=$manifestPath"
          }
          python scripts/build_patch.py `
            --base-dir "src/VaultSync.UI/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish" `
            --out-zip "$patchDir/vaultsync-patch-windows.zip" `
            --out-manifest "$patchDir/vaultsync-patch-windows.json" `
            --platform windows `
            @previousArgs `
            @baseManifestArgs `
            --skip-incompatible-bases `
            --target "$targetVersion"

      - name: Verify required Windows artifacts
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          $required = @(
          )
          if ("${{ inputs.include_windows_patches }}" -eq "true") {
            $required += "patches/v$($env:TARGET_VERSION)/vaultsync-patch-windows.json"
            $required += "patches/v$($env:TARGET_VERSION)/vaultsync-patch-windows.zip"
          }
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release artifact was not produced: $path"
            }
          }
          if (-not (Get-ChildItem "dist/windows/VaultSync-Setup-*.exe" -File -ErrorAction SilentlyContinue)) {
            throw "Required Windows installer was not produced."
          }

      - name: Prepare Microsoft Store manifest version
        if: ${{ inputs.include_store_upload }}
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          $target = $env:TARGET_VERSION
          $baseVersion = ($target -split "-", 2)[0]
          $parts = $baseVersion.Split(".")
          if ($parts.Count -lt 3) {
            throw "target_version '$target' must include at least major.minor.patch for Store packaging."
          }

          $storeVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $manifestPath = "packaging/VaultSync.Store/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("pkg", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $identity = $manifest.SelectSingleNode("/pkg:Package/pkg:Identity", $ns)
          if ($null -eq $identity) {
            throw "Could not find Package/Identity in $manifestPath."
          }

          $identity.Version = $storeVersion
          $manifest.Save((Resolve-Path $manifestPath))
          "STORE_PACKAGE_VERSION=$storeVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Add-Content $env:GITHUB_STEP_SUMMARY "## Microsoft Store package"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Store manifest version: ``$storeVersion``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Store identity: ``FlavioGiacchetti.480851279F98B``"

      - name: Build Microsoft Store upload package
        if: ${{ inputs.include_store_upload }}
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          $storeDir = Join-Path $PWD "dist/store"
          New-Item -ItemType Directory -Force $storeDir | Out-Null

          msbuild packaging/VaultSync.Store/VaultSync.Store.wapproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:VaultSyncReleaseChannel=stable `
            /p:VaultSyncPackageKind=microsoft-store-msix `
            /p:VaultSyncUpdateSource=microsoft-store `
            /p:VaultSyncOfficialBuild=true `
            /p:VaultSyncSignatureStatus=unsigned `
            /p:SourceRevisionId=${{ github.sha }} `
            /p:AppxPackageDir="$storeDir\\"

          $upload = Get-ChildItem -Path "packaging/VaultSync.Store", "dist/store" -Recurse -Include *.msixupload,*.appxupload |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $upload) {
            throw "Store upload package was not produced."
          }

          $extension = $upload.Extension
          $targetPath = Join-Path $storeDir "VaultSync-Store-$($env:TARGET_VERSION)-x64$extension"
          Copy-Item $upload.FullName $targetPath -Force
          Add-Content $env:GITHUB_STEP_SUMMARY "- Upload artifact: ``$targetPath``"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-assets
          if-no-files-found: error
          path: |
            dist/windows/VaultSync-Setup-*.exe
            patches/v${{ inputs.target_version }}/vaultsync-patch-windows.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-windows.zip

      - name: Upload Microsoft Store artifact
        if: ${{ inputs.include_store_upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-store-upload
          if-no-files-found: error
          path: |
            dist/store/VaultSync-Store-*-x64.msixupload
            dist/store/VaultSync-Store-*-x64.appxupload

  macos:
    if: ${{ !inputs.prepare_draft_from_run }}
    needs: [validate, quality-gate]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish (osx-arm64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r osx-arm64
          --self-contained true
          -p:VaultSyncReleaseChannel=stable
          -p:VaultSyncPackageKind=macos-dmg
          -p:VaultSyncUpdateSource=github
          -p:VaultSyncOfficialBuild=true
          -p:VaultSyncSignatureStatus=unsigned
          -p:SourceRevisionId=${{ github.sha }}

      - name: Publish (osx-x64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r osx-x64
          --self-contained true
          -p:VaultSyncReleaseChannel=stable
          -p:VaultSyncPackageKind=macos-dmg
          -p:VaultSyncUpdateSource=github
          -p:VaultSyncOfficialBuild=true
          -p:VaultSyncSignatureStatus=unsigned
          -p:SourceRevisionId=${{ github.sha }}

      - name: Verify embedded runtimes (macOS)
        run: >
          python3 scripts/runtime_pack_audit.py
          --runtimeconfig src/VaultSync.UI/bin/Release/net10.0/osx-arm64/publish/VaultSync.UI.runtimeconfig.json
          --runtimeconfig src/VaultSync.UI/bin/Release/net10.0/osx-x64/publish/VaultSync.UI.runtimeconfig.json

      - name: Thin architecture-specific native libraries
        run: |
          bash scripts/thin_macos_native_libraries.sh arm64 src/VaultSync.UI/bin/Release/net10.0/osx-arm64/publish
          bash scripts/thin_macos_native_libraries.sh x64 src/VaultSync.UI/bin/Release/net10.0/osx-x64/publish

      - name: Build DMGs
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          bash scripts/build_macos_dmg.sh "$TARGET_VERSION" arm64 src/VaultSync.UI/bin/Release/net10.0/osx-arm64/publish
          bash scripts/build_macos_dmg.sh "$TARGET_VERSION" x64 src/VaultSync.UI/bin/Release/net10.0/osx-x64/publish

      - name: Build patch assets
        if: ${{ inputs.include_macos_patches }}
        env:
          PATCH_BASE_VERSIONS: ${{ needs.validate.outputs.patch_base_versions_macos }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          mkdir -p "patches/v$TARGET_VERSION"
          base_versions=()
          previous_args=()
          while IFS= read -r base; do
            [[ -n "$base" ]] || continue
            base_versions+=( "$base" )
            previous_args+=( --previous "$base" )
          done <<< "$PATCH_BASE_VERSIONS"
          arm64_base_manifest_args=()
          x64_base_manifest_args=()
          for base in "${base_versions[@]:1}"; do
            mkdir -p .patch-bases/macos-apple-silicon .patch-bases/macos-intel
            for platform in macos-apple-silicon macos-intel; do
              path=".patch-bases/$platform/$base.json"
              curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
                "https://github.com/ATAC-Helicopter/VaultSync/releases/download/v$base/vaultsync-patch-$platform.json" \
                --output "$path"
            done
            arm64_base_manifest_args+=( --base-manifest "$base=.patch-bases/macos-apple-silicon/$base.json" )
            x64_base_manifest_args+=( --base-manifest "$base=.patch-bases/macos-intel/$base.json" )
          done
          arm64_patch_root="dist/macos/staging/arm64/VaultSync.app"
          x64_patch_root="dist/macos/staging/x64/VaultSync.app"
          if [[ "$TARGET_VERSION" == "1.8.7" ]]; then
            # The installed 1.8.6 helper patches Contents/MacOS. The updated
            # process then performs the one-time canonical bundle migration.
            arm64_patch_root="src/VaultSync.UI/bin/Release/net10.0/osx-arm64/publish"
            x64_patch_root="src/VaultSync.UI/bin/Release/net10.0/osx-x64/publish"
            mkdir -p "$arm64_patch_root/migration" "$x64_patch_root/migration"
            cp src/VaultSync.UI/Assets/VaultSync.icns "$arm64_patch_root/migration/VaultSync.icns"
            cp src/VaultSync.UI/Assets/VaultSync.icns "$x64_patch_root/migration/VaultSync.icns"
          fi
          python3 scripts/build_patch.py \
            --base-dir "$arm64_patch_root" \
            --out-zip "patches/v$TARGET_VERSION/vaultsync-patch-macos-apple-silicon.zip" \
            --out-manifest "patches/v$TARGET_VERSION/vaultsync-patch-macos-apple-silicon.json" \
            --platform macos \
            "${previous_args[@]}" \
            "${arm64_base_manifest_args[@]}" \
            --skip-incompatible-bases \
            --target "$TARGET_VERSION"
          python3 scripts/build_patch.py \
            --base-dir "$x64_patch_root" \
            --out-zip "patches/v$TARGET_VERSION/vaultsync-patch-macos-intel.zip" \
            --out-manifest "patches/v$TARGET_VERSION/vaultsync-patch-macos-intel.json" \
            --platform macos \
            "${previous_args[@]}" \
            "${x64_base_manifest_args[@]}" \
            --skip-incompatible-bases \
            --target "$TARGET_VERSION"

      - name: Verify required macOS artifacts
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            app="dist/macos/staging/$arch/VaultSync.app"
            [[ -f "$app/Contents/Info.plist" ]] || {
              echo "Missing canonical app bundle for $arch" >&2
              exit 1
            }
            [[ "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" == "com.vaultsync.app" ]]
            [[ "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" == "$TARGET_VERSION" ]]
            [[ "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" == "$TARGET_VERSION" ]]
            [[ "$(readlink "dist/macos/staging/$arch/Applications")" == "/Applications" ]]
            codesign --verify --deep --strict "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Identifier=com.vaultsync.app$'
          done
          required=(
            dist/macos/VaultSync-*-macos-apple-silicon.dmg
            dist/macos/VaultSync-*-macos-intel.dmg
          )
          if [[ "${{ inputs.include_macos_patches }}" == "true" ]]; then
            required+=(
              "patches/v$TARGET_VERSION/vaultsync-patch-macos-apple-silicon.json"
              "patches/v$TARGET_VERSION/vaultsync-patch-macos-apple-silicon.zip"
              "patches/v$TARGET_VERSION/vaultsync-patch-macos-intel.json"
              "patches/v$TARGET_VERSION/vaultsync-patch-macos-intel.zip"
            )
          fi
          for pattern in "${required[@]}"; do
            compgen -G "$pattern" >/dev/null || {
              echo "Required release artifact was not produced: $pattern" >&2
              exit 1
            }
          done
          if [[ "${{ inputs.include_macos_patches }}" == "true" && "$TARGET_VERSION" == "1.8.7" ]]; then
            for manifest in \
              "patches/v$TARGET_VERSION/vaultsync-patch-macos-apple-silicon.json" \
              "patches/v$TARGET_VERSION/vaultsync-patch-macos-intel.json"; do
              jq -e '.baseVersions == ["1.8.6"]' "$manifest" >/dev/null
              jq -e 'any(.files[]; .path == "migration/VaultSync.icns")' "$manifest" >/dev/null
              jq -e 'all(.files[]; (.path | startswith("Contents/") | not))' "$manifest" >/dev/null
            done
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-assets
          if-no-files-found: error
          path: |
            dist/macos/VaultSync-*-macos-apple-silicon.dmg
            dist/macos/VaultSync-*-macos-intel.dmg
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-apple-silicon.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-apple-silicon.zip
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-intel.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-macos-intel.zip

  linux:
    if: ${{ !inputs.prepare_draft_from_run }}
    needs: [validate, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish (linux-x64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r linux-x64
          --self-contained true
          -p:VaultSyncReleaseChannel=stable
          -p:VaultSyncPackageKind=linux-multi-format
          -p:VaultSyncUpdateSource=github
          -p:VaultSyncOfficialBuild=true
          -p:VaultSyncSignatureStatus=unsigned
          -p:SourceRevisionId=${{ github.sha }}

      - name: Publish (linux-arm64)
        run: >
          dotnet publish src/VaultSync.UI/VaultSync.UI.csproj
          -c Release
          -f net10.0
          -r linux-arm64
          --self-contained true
          -p:VaultSyncReleaseChannel=stable
          -p:VaultSyncPackageKind=linux-multi-format
          -p:VaultSyncUpdateSource=github
          -p:VaultSyncOfficialBuild=true
          -p:VaultSyncSignatureStatus=unsigned
          -p:SourceRevisionId=${{ github.sha }}

      - name: Verify embedded runtimes (Linux)
        run: >
          python3 scripts/runtime_pack_audit.py
          --runtimeconfig src/VaultSync.UI/bin/Release/net10.0/linux-x64/publish/VaultSync.UI.runtimeconfig.json
          --runtimeconfig src/VaultSync.UI/bin/Release/net10.0/linux-arm64/publish/VaultSync.UI.runtimeconfig.json

      - name: Build Linux archives
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          bash scripts/build_linux_release.sh "$TARGET_VERSION" x64 src/VaultSync.UI/bin/Release/net10.0/linux-x64/publish
          bash scripts/build_linux_release.sh "$TARGET_VERSION" arm64 src/VaultSync.UI/bin/Release/net10.0/linux-arm64/publish

      - name: Build patch assets
        if: ${{ inputs.include_linux_patches }}
        env:
          PATCH_BASE_VERSIONS: ${{ needs.validate.outputs.patch_base_versions_linux }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          mkdir -p "patches/v$TARGET_VERSION"
          base_versions=()
          previous_args=()
          while IFS= read -r base; do
            [[ -n "$base" ]] || continue
            base_versions+=( "$base" )
            previous_args+=( --previous "$base" )
          done <<< "$PATCH_BASE_VERSIONS"
          x64_base_manifest_args=()
          arm64_base_manifest_args=()
          for base in "${base_versions[@]:1}"; do
            mkdir -p .patch-bases/linux-x64 .patch-bases/linux-arm64
            for platform in linux-x64 linux-arm64; do
              path=".patch-bases/$platform/$base.json"
              curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
                "https://github.com/ATAC-Helicopter/VaultSync/releases/download/v$base/vaultsync-patch-$platform.json" \
                --output "$path"
            done
            x64_base_manifest_args+=( --base-manifest "$base=.patch-bases/linux-x64/$base.json" )
            arm64_base_manifest_args+=( --base-manifest "$base=.patch-bases/linux-arm64/$base.json" )
          done
          python3 scripts/build_patch.py \
            --base-dir "src/VaultSync.UI/bin/Release/net10.0/linux-x64/publish" \
            --out-zip "patches/v$TARGET_VERSION/vaultsync-patch-linux-x64.zip" \
            --out-manifest "patches/v$TARGET_VERSION/vaultsync-patch-linux-x64.json" \
            --platform linux \
            "${previous_args[@]}" \
            "${x64_base_manifest_args[@]}" \
            --skip-incompatible-bases \
            --target "$TARGET_VERSION"
          python3 scripts/build_patch.py \
            --base-dir "src/VaultSync.UI/bin/Release/net10.0/linux-arm64/publish" \
            --out-zip "patches/v$TARGET_VERSION/vaultsync-patch-linux-arm64.zip" \
            --out-manifest "patches/v$TARGET_VERSION/vaultsync-patch-linux-arm64.json" \
            --platform linux \
            "${previous_args[@]}" \
            "${arm64_base_manifest_args[@]}" \
            --skip-incompatible-bases \
            --target "$TARGET_VERSION"

      - name: Verify required Linux artifacts
        env:
          INCLUDE_LINUX_PATCHES: ${{ inputs.include_linux_patches }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          required=(
            dist/linux/VaultSync-*-linux-x64.tar.gz
            dist/linux/VaultSync-*-linux-arm64.tar.gz
            dist/linux/VaultSync-*-linux-x64.deb
            dist/linux/VaultSync-*-linux-arm64.deb
            dist/linux/VaultSync-*-linux-x64.AppImage
          )
          if [[ "$INCLUDE_LINUX_PATCHES" == "true" ]]; then
            required+=(
              "patches/v$TARGET_VERSION/vaultsync-patch-linux-x64.json"
              "patches/v$TARGET_VERSION/vaultsync-patch-linux-x64.zip"
              "patches/v$TARGET_VERSION/vaultsync-patch-linux-arm64.json"
              "patches/v$TARGET_VERSION/vaultsync-patch-linux-arm64.zip"
            )
          fi
          for pattern in "${required[@]}"; do
            compgen -G "$pattern" >/dev/null || {
              echo "Required release artifact was not produced: $pattern" >&2
              exit 1
            }
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-assets
          if-no-files-found: error
          path: |
            dist/linux/VaultSync-*-linux-x64.tar.gz
            dist/linux/VaultSync-*-linux-arm64.tar.gz
            dist/linux/VaultSync-*-linux-x64.deb
            dist/linux/VaultSync-*-linux-arm64.deb
            dist/linux/VaultSync-*-linux-x64.AppImage
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-x64.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-x64.zip
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-arm64.json
            patches/v${{ inputs.target_version }}/vaultsync-patch-linux-arm64.zip

  updater-qualification:
    name: Executable updater qualification (${{ matrix.os }})
    needs: [windows, macos, linux]
    if: ${{ inputs.include_windows_patches && inputs.include_macos_patches && inputs.include_linux_patches }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Download candidate packages and patches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release-assets'
          merge-multiple: true
          path: updater-assets
      - name: Ensure virtual X11 is available for Linux startup smoke tests
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y xvfb
          fi
      - name: Exercise released updater and candidate installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: >
          python scripts/qualify_updater.py --assets updater-assets
          --previous "$PREVIOUS_VERSION" --target "$TARGET_VERSION"
          --evidence updater-evidence
      - name: Preserve updater qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-qualification-${{ matrix.os }}
          path: updater-evidence
          if-no-files-found: warn

  release-manifest:
    name: Generate canonical release manifest
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download direct-release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true

      - name: Download Store upload for the canonical asset contract
        if: ${{ inputs.include_store_upload }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-store-upload
          path: release-assets/dist/store

      - name: Generate and verify canonical manifest
        shell: bash
        env:
          INCLUDE_LINUX_PATCHES: ${{ inputs.include_linux_patches }}
          INCLUDE_MACOS_PATCHES: ${{ inputs.include_macos_patches }}
          INCLUDE_WINDOWS_PATCHES: ${{ inputs.include_windows_patches }}
          INCLUDE_STORE_UPLOAD: ${{ inputs.include_store_upload }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          optional_args=()
          if [[ "$INCLUDE_LINUX_PATCHES" == "true" ]]; then
            optional_args+=( --include-linux-patches )
          fi
          if [[ "$INCLUDE_MACOS_PATCHES" == "true" ]]; then
            optional_args+=( --include-macos-patches )
          fi
          if [[ "$INCLUDE_WINDOWS_PATCHES" == "true" ]]; then
            optional_args+=( --include-windows-patches )
          fi
          if [[ "$INCLUDE_STORE_UPLOAD" == "true" ]]; then
            optional_args+=( --include-store-upload )
          fi
          python3 scripts/release_manifest.py generate \
            --asset-root release-assets \
            --output release-assets/vaultsync-release-manifest.json \
            --version "$TARGET_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --commit "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --previous "$PREVIOUS_VERSION" \
            "${optional_args[@]}"
          python3 scripts/release_manifest.py validate \
            --manifest release-assets/vaultsync-release-manifest.json \
            --asset-root release-assets

      - name: Upload canonical release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-release-manifest
          if-no-files-found: error
          path: release-assets/vaultsync-release-manifest.json

  supply-chain-proof:
    name: Generate SBOMs and attest release packages
    needs: [release-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Download direct-release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true

      - name: Download canonical release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-release-manifest
          path: release-assets

      - name: Download Store upload for supply-chain proof
        if: ${{ inputs.include_store_upload }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-store-upload
          path: release-assets/dist/store

      - name: Resolve dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supply-chain/project-assets
          for rid in win-x64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            framework=net10.0
            if [[ "$rid" == win-x64 ]]; then
              framework=net10.0-windows10.0.19041.0
            fi
            dotnet restore src/VaultSync.UI/VaultSync.UI.csproj \
              -p:EnableWindowsTargeting=true \
              -p:TargetFramework="$framework" \
              -r "$rid"
            cp src/VaultSync.UI/obj/project.assets.json "supply-chain/project-assets/$rid.json"
          done

      - name: Generate and validate SPDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          python3 scripts/release_sbom.py generate \
            --manifest release-assets/vaultsync-release-manifest.json \
            --project-assets supply-chain/project-assets \
            --output supply-chain/sboms \
            --created "$created"
          python3 scripts/release_sbom.py validate \
            --manifest release-assets/vaultsync-release-manifest.json \
            --sbom-root supply-chain/sboms
          sed 's# \*# *release-assets/#' \
            supply-chain/sboms/vaultsync-release-subjects.sha256 \
            > supply-chain/attestation-subjects.sha256

      - name: Attest release-package provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: supply-chain/attestation-subjects.sha256

      - name: Attest Windows installer SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/windows/VaultSync-Setup-${{ inputs.target_version }}.exe
          sbom-path: supply-chain/sboms/VaultSync-Setup-${{ inputs.target_version }}.exe.spdx.json

      - name: Resolve Microsoft Store proof paths
        if: ${{ inputs.include_store_upload }}
        id: store-proof
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find release-assets/dist/store -maxdepth 1 -type f \( -name '*.msixupload' -o -name '*.appxupload' \))
          [[ ${#packages[@]} == 1 ]] || { echo 'Expected exactly one Store upload package'; exit 1; }
          echo "package=${packages[0]}" >> "$GITHUB_OUTPUT"
          echo "sbom=supply-chain/sboms/$(basename "${packages[0]}").spdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest Microsoft Store upload SBOM
        if: ${{ inputs.include_store_upload }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.store-proof.outputs.package }}
          sbom-path: ${{ steps.store-proof.outputs.sbom }}

      - name: Attest macOS Apple silicon SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/macos/VaultSync-${{ inputs.target_version }}-macos-apple-silicon.dmg
          sbom-path: supply-chain/sboms/VaultSync-${{ inputs.target_version }}-macos-apple-silicon.dmg.spdx.json

      - name: Attest macOS Intel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/macos/VaultSync-${{ inputs.target_version }}-macos-intel.dmg
          sbom-path: supply-chain/sboms/VaultSync-${{ inputs.target_version }}-macos-intel.dmg.spdx.json

      - name: Attest Linux x64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/linux/VaultSync-${{ inputs.target_version }}-linux-x64.tar.gz
          sbom-path: supply-chain/sboms/VaultSync-${{ inputs.target_version }}-linux-x64.tar.gz.spdx.json

      - name: Attest Linux x64 Debian SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/linux/VaultSync-${{ inputs.target_version }}-linux-x64.deb
          sbom-path: supply-chain/sboms/VaultSync-${{ inputs.target_version }}-linux-x64.deb.spdx.json

      - name: Attest Linux x64 AppImage SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/linux/VaultSync-${{ inputs.target_version }}-linux-x64.AppImage
          sbom-path: supply-chain/sboms/VaultSync-${{ inputs.target_version }}-linux-x64.AppImage.spdx.json

      - name: Attest Linux arm64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/linux/VaultSync-${{ inputs.target_version }}-linux-arm64.tar.gz
          sbom-path: supply-chain/sboms/VaultSync-${{ inputs.target_version }}-linux-arm64.tar.gz.spdx.json

      - name: Attest Linux arm64 Debian SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/dist/linux/VaultSync-${{ inputs.target_version }}-linux-arm64.deb
          sbom-path: supply-chain/sboms/VaultSync-${{ inputs.target_version }}-linux-arm64.deb.spdx.json

      - name: Verify online and offline release-candidate provenance
        if: ${{ inputs.release_candidate }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          subject="release-assets/dist/windows/VaultSync-Setup-$TARGET_VERSION.exe"
          gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY"
          gh attestation trusted-root > supply-chain/trusted-root.jsonl
          gh attestation verify "$subject" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --custom-trusted-root supply-chain/trusted-root.jsonl

      - name: Upload release SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain-proof
          if-no-files-found: error
          path: |
            supply-chain/sboms
            supply-chain/trusted-root.jsonl

  prepare-draft:
    name: Assemble verified unpublished draft
    needs: [validate, quality-gate]
    if: ${{ inputs.prepare_draft_from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate qualified source run
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_RUN: ${{ inputs.prepare_draft_from_run }}
        run: |
          set -euo pipefail
          [[ "$ASSET_RUN" =~ ^[0-9]+$ ]] || { echo 'Asset run must be a numeric run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ASSET_RUN" > source-run.json
          jq -e '.conclusion == "success" and .head_branch == "Stable" and .path == ".github/workflows/release-assets.yml"' source-run.json
          source_sha="$(jq -r '.head_sha' source-run.json)"
          git merge-base --is-ancestor "$source_sha" origin/Stable
          git diff --exit-code "$source_sha" HEAD -- src installer packaging Directory.Build.props Directory.Packages.props global.json scripts/build_patch.py scripts/build_linux_release.sh scripts/build_macos_dmg.sh scripts/thin_macos_native_libraries.sh
      - name: Download qualified direct packages and patches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prepare_draft_from_run }}
          pattern: '*-release-assets'
          merge-multiple: true
          path: release-assets
      - name: Download qualified Store upload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prepare_draft_from_run }}
          name: windows-store-upload
          path: release-assets/dist/store
      - name: Download qualified canonical manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prepare_draft_from_run }}
          name: canonical-release-manifest
          path: release-assets
      - name: Verify assets and upload only to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py validate --manifest release-assets/vaultsync-release-manifest.json --asset-root release-assets
          store_upload="$(find release-assets/dist/store -maxdepth 1 -type f \( -name '*.msixupload' -o -name '*.appxupload' \))"
          python3 scripts/verify_store_upload.py "$store_upload" --version "$TARGET_VERSION" --source-manifest packaging/VaultSync.Store/Package.appxmanifest
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('release-assets')
          manifest = json.loads((root / 'vaultsync-release-manifest.json').read_text())
          source = json.loads(Path('source-run.json').read_text())
          assert manifest['release']['version'] == os.environ['TARGET_VERSION']
          assert manifest['release']['commit'] == source['head_sha']
          expected = {asset['name'] for asset in manifest['assets']} | {'vaultsync-release-manifest.json'}
          files = [path.name for path in root.rglob('*') if path.is_file()]
          assert len(files) == len(expected) and set(files) == expected, 'Unexpected or duplicated draft asset'
          assert len(manifest['assets']) == 19, 'Full platform/patch/Store matrix is required'
          PY
          tag="v$TARGET_VERSION"
          gh release view "$tag" --json isDraft,databaseId > draft-release.json
          jq -e '.isDraft == true' draft-release.json
          release_id="$(jq -r '.databaseId' draft-release.json)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" > draft-assets.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('release-assets')
          expected = {path.name: path for path in root.rglob('*') if path.is_file()}
          existing = json.loads(Path('draft-assets.json').read_text())
          names = set()
          for asset in existing:
              name = asset['name']
              assert name in expected and name not in names, 'Unexpected existing draft asset'
              path = expected[name]
              digest = hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              assert asset['size'] == path.stat().st_size and asset.get('digest') == 'sha256:' + digest, 'Draft asset differs; refusing overwrite'
              names.add(name)
          Path('missing-assets.txt').write_text(''.join(str(path) + '\n' for name, path in sorted(expected.items()) if name not in names))
          PY
          source_sha="$(jq -r '.release.commit' release-assets/vaultsync-release-manifest.json)"
          # A maintainer stages the draft target separately. GITHUB_TOKEN
          # cannot retarget releases at commits that modify workflows.
          gh release view "$tag" --json isDraft,targetCommitish \
            --jq '.' > draft-target.json
          jq -e --arg sha "$source_sha" '.isDraft == true and .targetCommitish == $sha' draft-target.json
          mapfile -t assets < missing-assets.txt
          if [[ ${#assets[@]} -gt 0 ]]; then
            gh release upload "$tag" "${assets[@]}"
          fi
          gh release view "$tag" --json isDraft,assets | jq -e '.isDraft == true and (.assets | length) == 20'
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" > uploaded-assets.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {path.name: path for path in Path('release-assets').rglob('*') if path.is_file()}
          uploaded = json.loads(Path('uploaded-assets.json').read_text())
          assert len(uploaded) == len(expected) and {asset['name'] for asset in uploaded} == set(expected)
          for asset in uploaded:
              path = expected[asset['name']]
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert asset['size'] == path.stat().st_size and asset.get('digest') == 'sha256:' + digest, 'Uploaded asset differs'
          PY

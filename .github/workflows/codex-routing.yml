name: Codex routing policy guard

on:
  pull_request:
    paths:
      - '.codex/**'
      - 'AGENTS.md'
      - 'docs/CODEX_ROUTING.md'
      - 'scripts/verify_codex_routing.py'
      - '.github/workflows/codex-routing.yml'
  push:
    branches: [Dev]
    paths:
      - '.codex/**'
      - 'AGENTS.md'
      - 'docs/CODEX_ROUTING.md'
      - 'scripts/verify_codex_routing.py'
      - '.github/workflows/codex-routing.yml'

permissions:
  contents: read

jobs:
  verify-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/verify_codex_routing.py

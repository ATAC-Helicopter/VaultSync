name: Qualify VaultSync 1.8.10 updater (no publication)

# Automatically qualifies the exact release-branch source after integration.
# In a normal PRIVATE mirror, the same push trigger can qualify confidential
# fixes without exposing them to the public upstream repository.
# Security-advisory temporary forks do not support Actions.
on:
  push:
    branches:
      - release/1.8.10
  workflow_dispatch:

# The called workflow contains an explicitly gated prepare-draft job that
# needs contents:write on manual stable publication. GitHub validates every
# called job permission even when that job is skipped in candidate mode.
# Callee-level permissions still restrict all non-draft jobs to read.
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: qualify-1.8.10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build, patch, install and verify 1.8.9 -> 1.8.10
    if: github.ref == 'refs/heads/release/1.8.10'
    uses: ./.github/workflows/release-assets.yml
    with:
      release_channel: stable
      previous_version: '1.8.9'
      target_version: '1.8.10'
      release_candidate: true
      include_windows_patches: true
      include_macos_patches: true
      include_linux_patches: true
      include_store_upload: false
      prepare_draft_from_run: ''

name: SonarQube

on:
  pull_request:
    branches: [ "Dev", "Stable", "release/**" ]
  push:
    # Release branches are analyzed by their required PR. Running again for the
    # same branch push duplicates the complete build and coverage pipeline.
    branches: [ "Dev", "Stable" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: SonarQube Cloud analysis
    # dotnet-coverage 18.9.0 produced an empty report on the 26.04 rollout.
    # Keep the measured runner until the profiler qualifies on a newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check SonarQube configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          configured=true
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::notice::SONAR_TOKEN is not configured; skipping SonarQube analysis."
            configured=false
          fi
          if [[ -z "${SONAR_ORGANIZATION}" ]]; then
            echo "::notice::SONAR_ORGANIZATION repository variable is not configured; skipping SonarQube analysis."
            configured=false
          fi
          if [[ -z "${SONAR_PROJECT_KEY}" ]]; then
            echo "::notice::SONAR_PROJECT_KEY repository variable is not configured; skipping SonarQube analysis."
            configured=false
          fi

          echo "configured=${configured}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked-out source identity
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]

      - name: Setup .NET
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.x"

      - name: Setup Java
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install analysis tools
        if: steps.config.outputs.configured == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.2.1
          dotnet tool install --global dotnet-coverage --version 18.9.0
          python -m pip install --only-binary :all: coverage==7.10.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        if: steps.config.outputs.configured == 'true'
        run: dotnet restore VaultSync.sln

      - name: Begin SonarQube analysis
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"

          dotnet sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.host.url="${host_url}" \
            /d:sonar.scm.revision="${EXPECTED_SOURCE_SHA}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="${RUNNER_TEMP}/coverage-main.xml,${RUNNER_TEMP}/recovery-storage/coverage-native.xml,${RUNNER_TEMP}/recovery-admission/coverage-admission.xml" \
            /d:sonar.python.coverage.reportPaths=python-coverage.xml \
            /d:sonar.exclusions="coverage.xml,python-coverage.xml,tools/rsync/**,**/bin/**,**/obj/**,**/*.ico,**/*.icns,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ttf,**/*.otf,**/Assets/backup/**" \
            /d:sonar.coverage.exclusions="benchmarks/**,docs/video/**,src/VaultSync.UI/**,src/VaultSync.Core/Services/BackupService.cs,src/VaultSync.Core/Services/NetworkMountService.cs,src/VaultSync.Core/Services/SnapshotService.cs" \
            /d:sonar.test.inclusions="tests/**/*" \
            /d:sonar.python.version="3"

      - name: Build
        if: steps.config.outputs.configured == 'true'
        run: dotnet build VaultSync.sln --configuration Release --no-restore -p:UseSharedCompilation=false -m:1

      - name: Test with coverage
        if: steps.config.outputs.configured == 'true'
        run: >
          dotnet-coverage collect
          "dotnet test tests/VaultSync.Core.Tests/VaultSync.Core.Tests.csproj --configuration Release --no-build"
          -f xml
          -o "${{ runner.temp }}/coverage-main.xml"

      - name: Test owned recovery storage in isolated namespace
        if: steps.config.outputs.configured == 'true'
        run: bash scripts/test_recovery_storage_native.sh "${{ runner.temp }}/recovery-storage"

      - name: Test recovery admission refusals in isolated namespace
        if: steps.config.outputs.configured == 'true'
        run: bash scripts/test_recovery_admission_native.sh "${{ runner.temp }}/recovery-admission"

      - name: Verify coverage collection
        if: steps.config.outputs.configured == 'true'
        run: |
          python3 scripts/validate_native_evidence_source.py "$EXPECTED_SOURCE_SHA"
          python3 scripts/validate_sonar_coverage.py "${{ runner.temp }}/coverage-main.xml"
          python3 scripts/validate_sonar_coverage.py "${{ runner.temp }}/recovery-storage/coverage-native.xml"
          python3 scripts/validate_sonar_coverage.py "${{ runner.temp }}/recovery-admission/coverage-admission.xml"

      - name: Retain isolated storage evidence
        if: always() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-storage-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/coverage-main.xml
            ${{ runner.temp }}/recovery-storage/coverage-native.xml
            ${{ runner.temp }}/recovery-storage/native-storage-evidence.json
            ${{ runner.temp }}/recovery-storage/**/*.trx
            ${{ runner.temp }}/recovery-admission/coverage-admission.xml
            ${{ runner.temp }}/recovery-admission/native-admission-evidence.json
            ${{ runner.temp }}/recovery-admission/**/*.trx

      - name: Test Python with coverage
        if: steps.config.outputs.configured == 'true'
        run: |
          python -m coverage run --source=scripts,experiments -m unittest discover -s tests/scripts -p 'test_*.py'
          python -m coverage xml -o python-coverage.xml

      - name: End SonarQube analysis
        if: steps.config.outputs.configured == 'true'
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

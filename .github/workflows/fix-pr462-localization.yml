name: Fix PR 462 localization

on:
  push:
    branches:
      - Dev
    paths:
      - .github/workflows/fix-pr462-localization.yml
  pull_request:
    branches:
      - Stable
    paths:
      - .github/workflows/fix-pr462-localization.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.repository == 'ATAC-Helicopter/VaultSync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev

      - name: Add missing Portuguese localization key
        shell: python
        run: |
          from pathlib import Path

          path = Path("Localization/strings.pt.json")
          text = path.read_text(encoding="utf-8")
          key = '"Dashboard.Hint.SnapshotsThisWeek"'

          if key not in text:
              lines = text.splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if line.lstrip().startswith('"Dashboard.Kpi.'):
                      indent = line[:len(line) - len(line.lstrip())]
                      newline = "\r\n" if line.endswith("\r\n") else "\n"
                      lines.insert(index, f'{indent}"Dashboard.Hint.SnapshotsThisWeek": "Snapshots criados esta semana",{newline}')
                      break
              else:
                  raise SystemExit("Could not find Dashboard.Kpi insertion point")

              path.write_text("".join(lines), encoding="utf-8", newline="")

      - name: Commit localization fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pr462-localization.yml
          git add Localization/strings.pt.json
          git commit -m "Fix Portuguese dashboard localization coverage"
          git push origin HEAD:Dev

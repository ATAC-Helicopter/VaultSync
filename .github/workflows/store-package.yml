name: Build Microsoft Store Package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Store package version (four-part, e.g. 1.7.2.0)"
        required: true
        default: "1.7.2.0"
      configuration:
        description: "Build configuration"
        required: true
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build-store-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore UI project for Store packaging
        run: dotnet restore src/VaultSync.UI/VaultSync.UI.csproj -p:TargetFramework=net8.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64

      - name: Detect installed UAP SDK
        id: detect_uap_sdk
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files (x86)\Windows Kits\10\DesignTime\CommonConfiguration\Neutral\UAP',
            'C:\Program Files (x86)\Windows Kits\10\Platforms\UAP'
          )

          $versions = foreach ($root in $roots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Get-ChildItem -Path $root -Recurse -Filter UAP.props -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                $versionName = Split-Path -Leaf $_.DirectoryName
                $parsedVersion = $null
                if ([version]::TryParse($versionName, [ref]$parsedVersion)) {
                  $versionName
                }
              }
          }

          $selected = $versions |
            Sort-Object -Unique |
            Sort-Object { [version]$_ } -Descending |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($selected)) {
            throw 'No installed UAP SDK version was found on the runner.'
          }

          Write-Host "Using UAP SDK version: $selected"
          "uap_sdk_version=$selected" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Microsoft Store package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "dist\store\"
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          msbuild packaging\VaultSync.Store\VaultSync.Store.wapproj `
            /p:Configuration=${{ inputs.configuration }} `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:TargetPlatformVersion=${{ steps.detect_uap_sdk.outputs.uap_sdk_version }} `
            /p:PackageVersion=${{ inputs.package_version }} `
            /p:AppxPackageDir="$packageDir"

      - name: Upload Store package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-package-assets
          path: |
            dist/store/**/*.msixupload
            dist/store/**/*.msixbundle
            dist/store/**/*.msix
            dist/store/**/*.appxupload
            dist/store/**/*.appxbundle
            dist/store/**/*.appx
            dist/store/**/*.cer
            dist/store/**/*.xml
            packaging/VaultSync.Store/Package.appxmanifest

name: Project Roadmap Sync

on:
  issues:
    types: [opened, reopened, edited, closed, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  sync-project:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    env:
      PROJECT_OWNER: Lavoro-Nostro
      PROJECT_NUMBER: "2"
      PROJECT_REPO: Lavoro-Nostro/VaultSync
      DEFAULT_OWNER: Flavio Giacchetti
      DEFAULT_TEAM: Work
      GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN || github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_STATE: ${{ github.event.issue.state }}
    steps:
      - name: Sync issue into roadmap project
        shell: bash
        run: |
          set -euo pipefail

          today="$(date -u +%F)"

          project_json="$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          project_id="$(jq -r '.id' <<< "$project_json")"

          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"

          field_id() {
            local name="$1"
            jq -r --arg n "$name" '.fields[] | select(.name==$n) | .id' <<< "$fields_json" | head -n1
          }

          option_id() {
            local field_name="$1"
            local option_name="$2"
            jq -r --arg f "$field_name" --arg o "$option_name" \
              '.fields[] | select(.name==$f) | .options[]? | select(.name==$o) | .id' <<< "$fields_json" | head -n1
          }

          status_field_id="$(field_id "Status")"
          owner_field_id="$(field_id "Owner")"
          team_field_id="$(field_id "Team")"
          start_field_id="$(field_id "Start date")"
          completed_field_id="$(field_id "Completed on")"
          repo_target_field_id="$(field_id "Repository target")"
          work_labels_field_id="$(field_id "Work labels")"

          todo_option_id="$(option_id "Status" "Todo")"
          done_option_id="$(option_id "Status" "Done")"
          team_option_id="$(option_id "Team" "$DEFAULT_TEAM")"
          if [[ -z "${team_option_id:-}" ]]; then
            team_option_id="$(jq -r '.fields[] | select(.name=="Team") | .options[0].id' <<< "$fields_json")"
          fi

          # Ensure item exists in project.
          item_id="$(
            gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 200 --format json |
            jq -r --argjson num "$ISSUE_NUMBER" '.items[] | select(.content.type=="Issue" and .content.number==$num) | .id' |
            head -n1
          )"

          if [[ -z "${item_id:-}" ]]; then
            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" >/dev/null
            item_id="$(
              gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 200 --format json |
              jq -r --argjson num "$ISSUE_NUMBER" '.items[] | select(.content.type=="Issue" and .content.number==$num) | .id' |
              head -n1
            )"
          fi

          if [[ -z "${item_id:-}" ]]; then
            echo "Could not resolve project item for issue #$ISSUE_NUMBER"
            exit 1
          fi

          # Enforce solo project defaults.
          gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$owner_field_id" --text "$DEFAULT_OWNER" >/dev/null
          gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$team_field_id" --single-select-option-id "$team_option_id" >/dev/null

          # Status + dates policy.
          if [[ "$ISSUE_STATE" == "closed" ]]; then
            gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$status_field_id" --single-select-option-id "$done_option_id" >/dev/null
            gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$completed_field_id" --date "$today" >/dev/null
          else
            gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$status_field_id" --single-select-option-id "$todo_option_id" >/dev/null
            gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$start_field_id" --clear >/dev/null || true
            gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$completed_field_id" --clear >/dev/null || true
          fi

          # Keep custom fallback fields aligned.
          gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$repo_target_field_id" --text "$PROJECT_REPO" >/dev/null || true

          issue_labels="$(gh issue view "$ISSUE_NUMBER" --repo "$PROJECT_REPO" --json labels | jq -r '.labels[].name' | paste -sd ', ' -)"
          kind="roadmap"
          title="$(gh issue view "$ISSUE_NUMBER" --repo "$PROJECT_REPO" --json title -q '.title')"
          if [[ "$title" =~ ^(VS|ISS|BUG|REL)- ]]; then
            kind="$(tr '[:upper:]' '[:lower:]' <<< "${BASH_REMATCH[1]}")"
          fi
          type_label=""
          if [[ "$title" =~ ^VS-16[0-9]{2}: ]]; then
            type_label="Feature"
          elif [[ "$title" =~ ^VS-17[0-9]{2}: ]]; then
            type_label="Improvement"
          elif [[ "$title" =~ ^VS-(18|19)[0-9]{2}: ]]; then
            type_label="Idea"
          fi
          status_slug="$(tr '[:upper:]' '[:lower:]' <<< "$ISSUE_STATE")"
          if [[ -z "${issue_labels:-}" ]]; then
            issue_labels="kind:$kind, status:$status_slug"
          fi
          gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$work_labels_field_id" --text "$issue_labels" >/dev/null || true

          # Ensure canonical issue labels exist on issue-backed items.
          if [[ -n "$type_label" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$PROJECT_REPO" --add-label "kind:$kind,status:$status_slug,$type_label" >/dev/null || true
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$PROJECT_REPO" --add-label "kind:$kind,status:$status_slug" >/dev/null || true
          fi

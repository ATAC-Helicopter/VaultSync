name: Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  announce:
    name: Announce published release
    # A retry after an uncertain network outcome must not create a second post.
    if: ${{ github.event.release.draft == false && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout notifier from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Stable
          persist-credentials: false

      - name: Announce release in Discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: python3 scripts/discord_release_announcement.py
